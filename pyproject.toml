# Dev-tooling config only (ruff lint settings) - NOT a package/dependency
# manifest. requirements.txt is the actual install path (see README.md
# Setup). A stray, empty uv.lock previously sat alongside this file with no
# corresponding [project.dependencies] table for it to lock against -
# removed 2026-08-08 since it was pure vestigial confusion, not a real
# alternative install path.
[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["Sources", "Concepts", "Protocols", "Daily", "Synthesis", "Research", "People", "Bloodwork"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names - would have caught today's bugs)
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # bugbear (common real-bug patterns)
    "SIM", # simplify
]
ignore = [
    "E501",  # line length - not worth blocking on for this project's scripts
]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_dashboard.py" = ["E741"]
